        body { background-color: #020617; color: #F8FAFC; font-family: 'Outfit', sans-serif; overflow-x: hidden; }
        
        /* Premium Dark Glass Effect with Gold Hint */
        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(212, 172, 54, 0.3); /* Gold Top Border */
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6), 0 0 30px rgba(33, 70, 139, 0.1);
            position: relative;
        }

        /* Diagonal Shine */
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0) 40%);
            border-radius: 2.5rem;
            pointer-events: none;
            z-index: 0;
        }

        .glass-button {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }
        .glass-button:hover {
            background: linear-gradient(to bottom right, rgba(33, 70, 139, 0.2), rgba(212, 172, 54, 0.1));
            border-color: rgba(212, 172, 54, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.4);
        }

        /* Background Elements - Brand Colors */
        .bg-blobs { position: fixed; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; z-index: 0; pointer-events: none; }
        .blob-1 { position: absolute; top: -20%; left: -20%; width: 90vw; height: 90vw; background: radial-gradient(circle, rgba(33, 70, 139, 0.2) 0%, rgba(0, 0, 0, 0) 60%); border-radius: 50%; filter: blur(80px); animation: blob 15s infinite alternate; }
        .blob-2 { position: absolute; bottom: -20%; right: -20%; width: 90vw; height: 90vw; background: radial-gradient(circle, rgba(212, 172, 54, 0.15) 0%, rgba(0, 0, 0, 0) 60%); border-radius: 50%; filter: blur(80px); animation: blob 18s infinite alternate-reverse; }

        .hero-grid {

            background-size: 50px 50px;
            mask-image: linear-gradient(to bottom, black 30%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 30%, transparent 100%);
        }

        /* Profile Ring */
        .profile-ring {

            background-size: 200% 200%;

        }
        @keyframes gradientSpin {

            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>

    <script>
        function downloadVCard() {
            // Updated vCard Data
            const vcardData = [
                'BEGIN:VCARD',
                'VERSION:3.0',
                'FN:Shaiju Dhamodharan',
                'N:Dhamodharan;Shaiju;;;',
                'ORG:Benefitz International',
                'TITLE:Managing Director',

                'TEL;TYPE=WHATSAPP,VOICE:+916235846558',
                'EMAIL;TYPE=WORK,INTERNET:shaiju@benefitz.international',
                'URL:https://www.benefitz.international',
                'ADR;TYPE=WORK:;;S2 - Burjuman Business Tower, Near Metro Exit 3;Dubai;;;UAE',
                'END:VCARD'
            ].join('\n');

            const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            
            link.href = url;
            link.setAttribute('download', 'Shaiju_Dhamodharan.vcf');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }
    </script>
