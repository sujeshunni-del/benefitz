                        blob: {
                            "0%": { transform: "translate(0px, 0px) scale(1)" },
                            "33%": { transform: "translate(30px, -50px) scale(1.1)" },
                            "66%": { transform: "translate(-20px, 20px) scale(0.9)" },

    <style>
        body { background-color: #020617; color: #F8FAFC; font-family: 'Outfit', sans-serif; overflow-x: hidden; }
        
        /* Premium Dark Glass Effect */
        .glass-card {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        /* Reflection Shine */
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(125deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.01) 30%, rgba(255,255,255,0) 100%);
            border-radius: 2.5rem;
            pointer-events: none;
            z-index: 0;
        }

        .glass-button {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }
        .glass-button:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.3);
        }

        /* Background Elements */
        .bg-blobs { position: fixed; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; z-index: 0; pointer-events: none; }
        .blob-1 { position: absolute; top: -20%; left: -20%; width: 90vw; height: 90vw; background: radial-gradient(circle, rgba(37, 99, 235, 0.15) 0%, rgba(0, 0, 0, 0) 60%); border-radius: 50%; filter: blur(80px); animation: blob 15s infinite alternate; }
        .blob-2 { position: absolute; bottom: -20%; right: -20%; width: 90vw; height: 90vw; background: radial-gradient(circle, rgba(245, 158, 11, 0.1) 0%, rgba(0, 0, 0, 0) 60%); border-radius: 50%; filter: blur(80px); animation: blob 18s infinite alternate-reverse; }
        .blob-3 { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); width: 60vw; height: 60vw; background: radial-gradient(circle, rgba(139, 92, 246, 0.1) 0%, rgba(0, 0, 0, 0) 60%); border-radius: 50%; filter: blur(90px); animation: blob 12s infinite linear; }

        .hero-grid {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; z-index: 0;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: linear-gradient(to bottom, black 20%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 20%, transparent 100%);
        }

        /* Profile Image Glow */
        .profile-container {
            position: relative;
            z-index: 10;
        }
        .profile-container::after {
            content: '';
            position: absolute;
            inset: -5px;
            border-radius: 2rem;
            background: linear-gradient(45deg, #21468B, #FF6600);
            z-index: -1;
            opacity: 0.6;
            filter: blur(15px);
            animation: pulseGlow 4s infinite;
        }
    </style>

    <script>
        function downloadVCard() {
            // Updated vCard Data
            const vcardData = [
                'BEGIN:VCARD',
                'VERSION:3.0',
                'FN:Shaiju Dhamodharan',
                'N:Dhamodharan;Shaiju;;;',
                'ORG:Benefitz International',
                'TITLE:Managing Director',
                'TEL;TYPE=CELL,VOICE:+971547641507',
                'TEL;TYPE=WHATSAPP,VOICE:+916235846558',
                'EMAIL;TYPE=WORK,INTERNET:shaiju@benefitz.international',
                'URL:https://www.benefitz.international',
                'ADR;TYPE=WORK:;;S2 - Burjuman Business Tower, Near Metro Exit 3;Dubai;;;UAE',
                'END:VCARD'
            ].join('\n');

            const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            
            link.href = url;
            link.setAttribute('download', 'Shaiju_Dhamodharan.vcf');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }
    </script>
