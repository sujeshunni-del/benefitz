        /* Animated Profile Ring Layers */
        .ring-layer {
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            border: 2px solid transparent;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            -webkit-mask-composite: destination-out;
        }

        .ring-1 {

            'END:VCARD'
        ].join('\n');

        // Function to download VCard
        function downloadVCard() {
            const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            
            link.href = url;
            link.setAttribute('download', 'SujeshKumar_Benefitz.vcf');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        // QR Code Modal Logic
        const qrModal = document.getElementById('qrModal');
        const qrImage = document.getElementById('qrImage');
        const qrLoader = document.getElementById('qrLoader');
        let qrGenerated = false;

        function openQRModal() {
            qrModal.classList.remove('hidden');
            qrModal.classList.add('flex');
            
            if (!qrGenerated) {
                // Use a public QR generator API with the URL encoded VCard data
                // To keep the QR code dense but scannable, we encode the MECARD/VCARD string.
                const encodedData = encodeURIComponent(vcardData);
                const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodedData}&margin=10`;
                
                qrImage.onload = () => {
                    qrLoader.classList.add('hidden');
                    qrImage.classList.remove('hidden');
                    qrGenerated = true;
                };
                qrImage.src = qrUrl;
            }
        }

        function closeQRModal() {
            qrModal.classList.add('hidden');
            qrModal.classList.remove('flex');
        }
    </script>
</body>
</html>
